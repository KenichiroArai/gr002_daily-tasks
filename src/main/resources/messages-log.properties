# 持ち越しの収集のログメッセージ
# キーは Gr002LogMsgTypes の key。ログは SLF4J の {} を埋め込み位置に使う

# application
Gr002Log12000=モード={}、取得={} 件、解析・保存={} 件、集計={} 日
Gr002Log12001=標準時間で補完した行={} 件、標準時間が未登録の行={} 件
Gr002Log12011=全件
Gr002Log12012=差分

# domain
Gr002Log12002=#{} タイトルから日付を取得できません: {}
Gr002Log12003=#{} 持ち越し元の日付がありません: {}
Gr002Log12004=#{} 項目名を取得できません: {}
Gr002Log12005=#{} 時間表記を解釈できないため標準時間で補完します: {}
Gr002Log12006=#{} 標準時間が未登録のため 0 分とします: {}
Gr002Log12007=#{} 想定外の行です: {}
Gr002Log12008=#{} 残数と解析件数が一致しません: 残={}, 解析={}

# repository
Gr002Log12009=標準時間の設定ファイルがありません: {}
Gr002Log12010=Issue を {} 件取得しました（{} ページ）
