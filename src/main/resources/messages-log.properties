# 持ち越しの収集のログメッセージ
# キーは Gr002LogMsgTypes の定数名。ログは SLF4J の {} を埋め込み位置に使う

# application
GR002_LOG12000=モード={}、取得={} 件、解析・保存={} 件、集計={} 日
GR002_LOG12001=標準時間で補完した行={} 件、標準時間が未登録の行={} 件
GR002_LOG12011=全件
GR002_LOG12012=差分

# domain
GR002_LOG12002=#{} タイトルから日付を取得できません: {}
GR002_LOG12003=#{} 持ち越し元の日付がありません: {}
GR002_LOG12004=#{} 項目名を取得できません: {}
GR002_LOG12005=#{} 時間表記を解釈できないため標準時間で補完します: {}
GR002_LOG12006=#{} 標準時間が未登録のため 0 分とします: {}
GR002_LOG12007=#{} 想定外の行です: {}
GR002_LOG12008=#{} 残数と解析件数が一致しません: 残={}, 解析={}

# repository
GR002_LOG12009=標準時間の設定ファイルがありません: {}
GR002_LOG12010=Issue を {} 件取得しました（{} ページ）
