# 持ち越しの収集のログメッセージ
# キーは Gr002LogMsgTypes の key。ログは SLF4J の {} を埋め込み位置に使う
#
# メッセージコードの採番規則:
# 形式: GR002_LOG + 5桁。種別はプレフィックスのみで表す。
# 1桁目（層）: 0 共通 / 1 domain / 2 infrastructure / 3 application / 4 presentation / 5 repository
# 2桁目（層内）:
#   domain: 0 共通 / 1 dto / 2 logic / 3 types
#   infrastructure: 0 共通 / 1 context / 2 types.msg
#   application: 0 共通 / 1 service / 2 logic / 3 model / 4 types
#   presentation: 0 共通 / 1 command / 2 model / 3 service / 4 types
#   repository: 0 共通 / 1 api.github / 2 dao.carryoverdata / 3 dao.defaultminutes / 4 dto.json / 5 types
# 3〜5桁目: 区分内の連番 000〜999
# 番号の帰属は呼び出し側の実装パッケージ。ログは出力箇所ごとに固有 ID。空きにした旧番号は再利用しない。

# domain.logic
Gr002Log12000=#{} タイトルから日付を取得できません: {}
Gr002Log12001=#{} 持ち越し元の日付がありません: {}
Gr002Log12002=#{} 項目名を取得できません: {}
Gr002Log12003=#{} 時間表記を解釈できないため標準時間で補完します: {}
Gr002Log12004=#{} 標準時間が未登録のため 0 分とします: {}
Gr002Log12005=#{} 想定外の行です: {}
Gr002Log12006=#{} 残数と解析件数が一致しません: 残={}, 解析={}
Gr002Log12007=#{} を解析しました: 項目={} 件
Gr002Log12008=集計しました: 日数={}、最新Issue={}、項目={}

