# 持ち越しの収集の一般メッセージ
# キーは Gr002GenMsgTypes の key。例外は String.format の %s / %d を埋め込み位置に使う

# 使い方
Gr002Gen11100=使い方: java -jar gr002_daily-tasks-0.1.0.jar [--full] [--help]\n\
\ \ （引数なし）  差分モード。最新 10 件の Issue は毎回解析し直し、それ以外は保存済みの JSON と更新日時が同じなら解析しない\n\
\ \ --full        全件モード。#1 から最新まで解析し直す\n\
\ \ --help, -h    この使い方を表示する\n\
環境変数 GITHUB_TOKEN が設定されている場合は GitHub API の認証に使う

# 引数・取得元・GitHub API
Gr002Gen11101=不明な引数です: %s
Gr002Gen11102=不明な残り時間の取得元です: %s
Gr002Gen11103=GitHub API の呼び出しに失敗しました: status=%d, uri=%s
Gr002Gen11104=GitHub API の応答が配列ではありません: uri=%s
Gr002Gen11105=GitHub API の呼び出しが中断されました
Gr002Gen11106=GitHub API の応答がオブジェクトではありません: uri=%s
