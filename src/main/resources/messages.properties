# 持ち越しの収集の一般メッセージ
# キーは Gr002GenMsgTypes の key。例外は String.format の %s / %d を埋め込み位置に使う
#
# メッセージコードの採番規則:
# 形式: GR002_GEN + 5桁。種別はプレフィックスのみで表す。
# 1桁目（層）: 0 共通 / 1 domain / 2 infrastructure / 3 application / 4 presentation / 5 repository
# 2桁目（層内）:
#   domain: 0 共通 / 1 dto / 2 logic / 3 types
#   infrastructure: 0 共通 / 1 context / 2 types.msg
#   application: 0 共通 / 1 service / 2 logic / 3 model / 4 types
#   presentation: 0 共通 / 1 command / 2 model / 3 service / 4 types
#   repository: 0 共通 / 1 api.github / 2 dao.carryoverdata / 3 dao.defaultminutes / 4 dto.json / 5 types
# 3〜5桁目: 区分内の連番 000〜999
# 番号の帰属は呼び出し側の実装パッケージ。空きにした旧番号は再利用しない。

# domain.dto
Gr002Gen11000=不明な残り時間の取得元です: %s

# application.service
Gr002Gen31000=単位が残っている状態で open は呼び出せません

# presentation.command
Gr002Gen41000=使い方: java -jar gr002_daily-tasks-0.1.0.jar [--full] [--help]\n\
\ \ （引数なし）  差分モード。最新 10 件の Issue だけを取得して毎回解析し直す。古い Issue は --full で扱う\n\
\ \ --full        全件モード。#1 から最新まで解析し直す\n\
\ \ --help, -h    この使い方を表示する\n\
環境変数 GITHUB_TOKEN が設定されている場合は GitHub API の認証に使う
Gr002Gen41001=不明な引数です: %s

# repository.api.github
Gr002Gen51000=GitHub API の呼び出しに失敗しました: status=%d, uri=%s
Gr002Gen51001=GitHub API の応答が配列ではありません: uri=%s
Gr002Gen51002=GitHub API の呼び出しが中断されました
Gr002Gen51003=GitHub API の応答がオブジェクトではありません: uri=%s
